<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVA Design</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="android-chrome-512x512.png">
<meta name="theme-color" content="#08070c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<style>
  :root{
    --bg:#08070c;
    --bg-2:#0d0b14;
    --violet:#8b5cf6;
    --violet-2:#a855f7;
    --violet-glow: rgba(139,92,246,.55);
    --text:#f5f4f9;
    --muted:#9b96ab;
    --line: rgba(255,255,255,.08);
    --card: rgba(255,255,255,.03);
    --radius: 16px;
    --display: 'Sora', sans-serif;
    --body: 'Manrope', sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html{scroll-behavior:smooth;}

  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--body);
    overflow-x:hidden;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background:
      radial-gradient(circle at 78% 20%, rgba(139,92,246,.16), transparent 45%),
      radial-gradient(circle at 15% 70%, rgba(168,85,247,.10), transparent 40%);
    pointer-events:none;
    z-index:0;
  }
  a{color:inherit; text-decoration:none;}

  ul{list-style:none;}

  img{max-width:100%; display:block;}

  button{font-family:inherit;}

  section{position:relative; z-index:1;}

  .wrap{max-width:1300px; margin:0 auto; padding:0 48px;}

  ::selection{background:var(--violet); color:#fff;}

  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:linear-gradient(var(--violet), var(--violet-2)); border-radius:10px;}

  /* ---------- NAV ---------- */
  header{
  position:fixed; 
  top:0; 
  left:0; 
  right:0; 
  z-index:100;
  padding:22px 48px;
  display:flex; align-items:center; 
  justify-content:space-between;
  transition: background .3s ease, 
  padding .3s ease, 
  border-color .3s ease;
  border-bottom:1px solid transparent;
  }

  header.scrolled{
    background:rgba(8,7,12,.82);
    backdrop-filter: blur(16px);
    padding:14px 48px;
    border-bottom:1px solid var(--line);
  }

  .logo{
    display:flex; 
    flex-direction:column; 
    line-height:1; 
    background:none; 
    border:none; 
    cursor:pointer; 
    color:inherit;
  }

  .logo .mark{
    font-family:var(--display); 
    font-weight:800; 
    font-size:26px; 
    letter-spacing:1px;
  }

  .logo .mark span{
    color:var(--violet-2);
  }

  .logo .sub{
    font-size:10px; 
    letter-spacing:5px; 
    color:var(--muted); 
    margin-top:4px; 
    text-align:left;
  }

  nav.links{
    display:flex; 
    gap:38px;
  }

  nav.links button{
    font-size:14.5px; 
    font-weight:600; 
    color:#d7d4e0;
    position:relative; 
    padding-bottom:6px; 
    transition:color .25s ease;
    background:none; 
    border:none; 
    cursor:pointer;
  }

  nav.links button::after{
    content:""; 
    position:absolute; 
    left:0; 
    bottom:0; 
    width:0; 
    height:2px;
    background:linear-gradient(90deg, var(--violet), var(--violet-2));
    transition:width .3s ease;
    border-radius:2px;
  }

  nav.links button:hover{color:#fff;}
  nav.links button:hover::after, nav.links button.active::after{width:100%;}
  nav.links button.active{color:#fff;}

  .cta-btn{
    border:1.5px solid var(--violet-2);
    padding:12px 24px; border-radius:999px;
    font-weight:700; font-size:14px;
    display:inline-flex; align-items:center; gap:8px;
    background:transparent; color:#fff; cursor:pointer;
    transition: all .3s ease;
  }

  .cta-btn:hover{
    background:var(--violet-2);
    box-shadow:0 0 28px var(--violet-glow);
    transform:translateY(-2px);
  }

  .cta-btn svg{transition:transform .3s ease;}
  .cta-btn:hover svg{transform:translateX(4px);}

  .burger{
    display:none; 
    flex-direction:column; 
    gap:5px; 
    cursor:pointer; 
    z-index:120; 
    background:none; 
    border:none;
  }

  .burger span{width:26px; height:2px; background:#fff; transition:.3s; display:block;}

  .mobile-menu{
    position:fixed; 
    inset:0; 
    background:rgba(8,7,12,.98); 
    backdrop-filter:blur(20px);
    z-index:110; 
    display:flex; 
    flex-direction:column; 
    align-items:center; 
    justify-content:center; 
    gap:28px;
    transform:translateY(-100%); 
    transition:transform .4s ease; 
    opacity:0;
  }

  .mobile-menu.open{transform:translateY(0); opacity:1;}
  .mobile-menu button{font-family:var(--display); font-size:26px; font-weight:700; background:none; border:none; color:#fff; cursor:pointer;}

  /* ---------- HERO ---------- */
  .hero{
    min-height:100vh;
    display:flex; align-items:center;
    padding-top:120px; 
    padding-bottom:60px;
  }

  .hero-grid{
    display:grid; grid-template-columns:1.05fr .9fr 260px; gap:20px; align-items:center;
  }

  .eyebrow{
    color:var(--violet-2); 
    letter-spacing:4px; 
    font-size:13px; 
    font-weight:700;
    margin-bottom:18px; 
    opacity:0; 
    animation:fadeUp .8s ease .1s forwards;
  }

  h1.headline{
    font-family:var(--display); 
    font-weight:800;
    font-size:clamp(40px, 5.2vw, 74px);
    line-height:1.02; 
    letter-spacing:-1px; 
    text-transform:uppercase;
    opacity:0; animation:fadeUp .8s ease .25s forwards;
  }

  h1.headline .grad{
    background:linear-gradient(90deg, var(--violet), var(--violet-2), #c084fc);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    background-size:200% auto;
    animation:shine 5s linear infinite;
  }

  @keyframes shine{ to{background-position:200% center;} }

  .divider{
    width:70px; 
    height:3px; 
    margin:22px 0;
    background:linear-gradient(90deg, var(--violet), var(--violet-2));
    border-radius:3px;
    opacity:0; animation:fadeUp .8s ease .4s forwards;
  }

  .hero p.desc{
    color:var(--muted); font-size:17px; line-height:1.65; max-width:480px;
    opacity:0; animation:fadeUp .8s ease .5s forwards;
  }

  .hero p.desc strong{color:#fff;}

  .hero-btns{
    display:flex; 
    gap:16px; 
    margin-top:32px; 
    opacity:0; 
    animation:fadeUp .8s ease .65s forwards;
  }

  .btn-solid{
    background:linear-gradient(135deg, var(--violet), var(--violet-2));
    color:#fff; 
    padding:15px 28px; 
    border-radius:12px; 
    font-weight:700; 
    font-size:15px;
    display:inline-flex; 
    align-items:center; 
    gap:10px; 
    border:none; 
    cursor:pointer;
    transition:transform .3s ease, box-shadow .3s ease;
  }

  .btn-solid:hover{transform:translateY(-3px); box-shadow:0 12px 30px var(--violet-glow);}

  .btn-outline{
    border:1.5px solid var(--line); 
    color:#fff; 
    padding:15px 26px; 
    border-radius:12px;
    font-weight:700; 
    font-size:15px; 
    display:inline-flex; 
    align-items:center; 
    gap:10px;
    background:rgba(255,255,255,.02); cursor:pointer; transition:.3s ease;
  }

  .btn-outline:hover{border-color:var(--violet-2); background:rgba(139,92,246,.08); transform:translateY(-3px);}
  .btn-solid svg, .btn-outline svg{transition:transform .3s ease;}
  .btn-solid:hover svg, .btn-outline:hover svg{transform:translateX(4px);}

  .services-strip{
    margin-top:52px; 
    padding:26px; 
    border-radius:18px;
    background:var(--card); 
    border:1px solid var(--line);
    display:grid; 
    grid-template-columns:repeat(6,1fr); gap:10px;
    opacity:0; 
    animation:fadeUp .8s ease .8s forwards;
  }
  
  .services-strip .item{
    display:flex;
    flex-direction:column; 
    align-items:center; 
    gap:10px; 
    text-align:center;
    padding:8px 4px; 
    border-radius:12px; 
    cursor:pointer; 
    transition:.3s ease; 
    background:none; 
    border:none;
  }

  .services-strip .item:hover{background:rgba(139,92,246,.08); transform:translateY(-4px);}

  .services-strip .icon{
    width:44px; 
    height:44px; 
    border-radius:12px;
    display:flex; 
    align-items:center; 
    justify-content:center;
    background:rgba(139,92,246,.14); 
    color:var(--violet-2);
  }

  .services-strip .item span{font-size:12.5px; font-weight:600; color:#d7d4e0; line-height:1.25;}

  /* mascot */

  .mascot-col{
    position:relative; 
    display:flex; 
    justify-content:center;
  }

  .orbit-wrap{
    position:relative;
    width:100%;
    max-width:300px;
    aspect-ratio:1/1;
    margin:0 auto;
    animation:float 4.5s ease-in-out infinite;
  }

  @keyframes float{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-16px);} }

  .orbit-glow{
    position:absolute; inset:-15%;
    background:radial-gradient(circle at center, rgba(139,92,246,.35), transparent 70%);
    filter:blur(20px);
    animation:pulseSmoke 3.5s ease-in-out infinite;
    pointer-events:none;
  }

  @keyframes pulseSmoke{ 0%,100%{opacity:.5; transform:scale(1);} 50%{opacity:.85; transform:scale(1.1);} }

  .orbit-lines{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }

  .orbit-line{
    stroke:var(--violet-2); stroke-width:.6; opacity:.5;
    stroke-dasharray:40; stroke-dashoffset:40;
    animation:lineDraw 1s ease forwards;
  }

  @keyframes lineDraw{ to{stroke-dashoffset:0;} }

  .orbit-core{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:92px; height:92px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 35% 30%, rgba(168,85,247,.55), rgba(139,92,246,.25) 60%, rgba(139,92,246,.08) 100%);
    border:1px solid rgba(168,85,247,.5);
    font-family:var(--display); font-weight:800; font-size:17px; letter-spacing:.5px;
    color:#fff;
    animation:orbitCore 3.5s ease-in-out infinite;
    z-index:2;
  }

  .orbit-core b{color:var(--violet-2);}

  @keyframes orbitCore{
    0%,100%{ box-shadow:0 0 26px 4px var(--violet-glow); transform:translate(-50%,-50%) scale(1); }
    50%{ box-shadow:0 0 42px 10px var(--violet-glow); transform:translate(-50%,-50%) scale(1.05); }
  }

  .orbit-node{
    position:absolute; transform:translate(-50%,-50%) scale(.3);
    width:50px; height:50px; border-radius:14px;
    background:rgba(139,92,246,.14); border:1px solid rgba(139,92,246,.32);
    display:flex; align-items:center; justify-content:center; color:var(--violet-2);
    opacity:0;
    animation:orbitNodeIn .6s ease forwards, orbitNodePulse 3s ease-in-out infinite;
    transition:transform .3s ease, background .3s ease, color .3s ease;
    cursor:default;
  }

  .orbit-node:hover{ transform:translate(-50%,-50%) scale(1.15); background:rgba(139,92,246,.3); color:#fff; }

  @keyframes orbitNodeIn{ from{opacity:0; transform:translate(-50%,-50%) scale(.3);} to{opacity:1; transform:translate(-50%,-50%) scale(1);} }
  @keyframes orbitNodePulse{ 0%,100%{box-shadow:0 0 0 0 rgba(139,92,246,0);} 50%{box-shadow:0 0 16px 3px rgba(139,92,246,.35);} }

  /* features list */

  .features{
    display:flex;
    flex-direction:column; 
    gap:24px;
  }

  .feature{
    display:flex; 
    gap:14px; 
    align-items:flex-start;
    opacity:0; 
    transform:translateX(30px); 
    animation:slideIn .7s ease forwards;
  }
  .feature:nth-child(1){animation-delay:.9s;}
  .feature:nth-child(2){animation-delay:1.05s;}
  .feature:nth-child(3){animation-delay:1.2s;}
  .feature:nth-child(4){animation-delay:1.35s;}

  @keyframes slideIn{ to{opacity:1; transform:translateX(0);} }

  .feature .ic{
    width:42px; 
    height:42px; 
    min-width:42px; 
    border-radius:12px;
    background:rgba(139,92,246,.14); border:1px solid rgba(139,92,246,.3);
    display:flex; 
    align-items:center; 
    justify-content:center; 
    color:var(--violet-2);
  }

  .feature h4{font-size:14.5px; font-weight:700;}
  .feature p{font-size:12.5px; color:var(--muted); margin-top:2px;}

  @keyframes fadeUp{ from{opacity:0; transform:translateY(22px);} to{opacity:1; transform:translateY(0);} }
  @keyframes pageFade{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);} }
  
  .page-enter{animation:pageFade .5s ease forwards;}

  /* ---------- PAGE HEADER (About/Services/Portfolio/Pricing/Contact) ---------- */

  .page-header{
    padding:150px 0 50px; 
    text-align:center;
  }

  .breadcrumb{
    color:var(--muted); 
    font-size:13px; 
    margin-top:14px;
  }

  .breadcrumb span{
    color:var(--violet-2); 
    font-weight:700;
  }

  /* ---------- SECTION HEADERS ---------- */

  .sec-head{
    max-width:620px; 
    margin:0 auto 56px; 
    text-align:center;
  }

  .sec-eyebrow{
    color:var(--violet-2); 
    font-weight:700; 
    letter-spacing:3px; 
    font-size:12.5px; 
    margin-bottom:14px;
  }

  .sec-title{
    font-family:var(--display); 
    font-weight:800; 
    font-size:clamp(28px,3.6vw,44px); 
    text-transform:uppercase; 
    letter-spacing:-.5px;
  }

  .sec-title span{
    color:var(--violet-2);
  }

  .sec-desc{
    color:var(--muted); 
    margin-top:16px; 
    font-size:15.5px; 
    line-height:1.7;
  }

  section.pad{padding:100px 0;}

  section.pad.alt{background:linear-gradient(180deg, transparent, rgba(139,92,246,.035), transparent);}

  /* ---------- IMAGE PLACEHOLDER ---------- */

  .img-placeholder{
    border:1.5px dashed var(--line);
    border-radius:var(--radius);
    background:rgba(255,255,255,.02);
    display:flex; 
    flex-direction:column; 
    align-items:center; 
    justify-content:center;
    gap:8px; 
    color:var(--muted); 
    font-size:12px; 
    font-weight:600; 
    text-align:center; 
    padding:18px;
    transition:.3s ease; 
    width:100%;
  }

  .img-placeholder:hover{border-color:var(--violet-2); background:rgba(139,92,246,.06); color:#fff;}
  
  .img-placeholder svg{color:var(--violet-2);}
  
  .img-placeholder small{color:var(--muted); font-weight:500; font-size:10.5px; letter-spacing:.5px;}

  /* ---------- ABOUT ---------- */

  .about-grid{
    display:grid; 
    grid-template-columns:.9fr 1.1fr; 
    gap:70px; 
    align-items:center;
  }

  .about-card{
    background:var(--card); 
    border:1px solid var(--line); 
    border-radius:20px; 
    padding:36px;
    position:relative; 
    overflow:hidden;
  }

  .about-card::before{
    content:""; 
    position:absolute; 
    top:-40%; 
    right:-40%; 
    width:280px; 
    height:280px; 
    border-radius:50%;
    background:radial-gradient(circle, rgba(139,92,246,.25), transparent 70%);
  }

  .about-stats{
    display:grid; 
    grid-template-columns:1fr 1fr; 
    gap:24px; 
    margin-top:28px;
  }

  .stat b{
    font-family:var(--display); 
    font-size:32px; 
    color:var(--violet-2); 
    display:block;
  }

  .stat span{
    font-size:12.5px; 
    color:var(--muted);
  }

  .about-grid p{
    color:var(--muted); 
    line-height:1.8; 
    font-size:15.5px; 
    margin-bottom:16px;
  }

  .about-grid p strong{color:#fff;}
  
  .about-gallery{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:60px;}
  
  .about-gallery .img-placeholder{aspect-ratio:4/3;}
  
  .team-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:22px; margin-top:60px;}
  
  .team-card{text-align:center;}
  
  .team-card .img-placeholder{aspect-ratio:1/1; border-radius:50%; margin-bottom:14px;}
  
  .team-card h4{font-size:14.5px;}
  
  .team-card span{font-size:12px; color:var(--muted);}

  /* ---------- SERVICES CARDS ---------- */
  .cards-grid{
    display:grid; 
    grid-template-columns:repeat(3,1fr); 
    gap:24px;
  }

  .service-card{
    background:var(--card); 
    border:1px solid var(--line); 
    border-radius:18px; 
    padding:28px;
    transition:.35s ease; 
    cursor:default; 
    position:relative; 
    overflow:hidden;
    display:flex; 
    flex-direction:column;
  }

  .service-card:hover{
    transform:translateY(-8px); border-color:var(--violet-2);
    box-shadow:0 20px 40px rgba(139,92,246,.15);
  }

  .service-card .icon-lg{
    width:54px; 
    height:54px; 
    border-radius:14px; 
    margin-bottom:20px;
    background:linear-gradient(135deg, rgba(139,92,246,.25), rgba(168,85,247,.1));
    display:flex; 
    align-items:center; 
    justify-content:center; 
    color:var(--violet-2);
  }

  .service-card h3{font-family:var(--display); font-size:19px; margin-bottom:10px;}
 
  .service-card p{color:var(--muted); font-size:14px; line-height:1.6; margin-bottom:18px;}
 
  .service-card .img-placeholder{aspect-ratio:16/10; margin-top:auto;}

  /* ---------- PORTFOLIO ---------- */
 
  .portfolio-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:22px;}
 
  .p-item{
    border-radius:16px; 
    overflow:hidden; 
    position:relative;
    border:1px solid var(--line); 
    cursor:default; 
    background:var(--card);
    transition:.35s ease;
  }

  .p-item:hover{
    transform:translateY(-6px);
    border-color:var(--violet-2);
    box-shadow:0 20px 40px rgba(139,92,246,.15);
  }

  .p-item .img-placeholder{aspect-ratio:4/3; 
    border-radius:16px 16px 0 0; 
    border:none; 
    border-bottom:1px solid var(--line);
  }
  
  .p-item .info{padding:18px;}
  
  .p-item .tag{
    font-size:11px; 
    letter-spacing:2px;
    color:var(--violet-2); 
    font-weight:700;
  }

  .p-item h4{
    font-family:var(--display); 
    font-size:16px; 
    margin-top:8px;
  }

  .filter-bar{
    display:flex; 
    gap:12px; 
    justify-content:center; 
    flex-wrap:wrap; 
    margin-bottom:44px;
  }
  
  .filter-bar button{
    padding:10px 20px; 
    border-radius:999px; 
    border:1.5px solid var(--line); 
    background:rgba(255,255,255,.02);
    color:#d7d4e0; 
    font-size:13px; 
    font-weight:600; 
    cursor:pointer; 
    transition:.3s ease;
  }

  .filter-bar button:hover{border-color:var(--violet-2);}
  
  .filter-bar button.active{background:var(--violet-2); border-color:var(--violet-2); color:#fff;}

  /* ---------- PRICING ---------- */
  
  .pricing-grid{
    display:grid; 
    grid-template-columns:repeat(3,1fr); 
    gap:24px; 
    align-items:start;
  }
  
  .price-card{
    background:var(--card); 
    border:1px solid var(--line); 
    border-radius:20px; 
    padding:36px 30px;
    transition:.35s ease;
  }

  .price-card.featured{
    border-color:var(--violet-2); 
    background:linear-gradient(180deg, rgba(139,92,246,.1), rgba(139,92,246,.02));
    transform:scale(1.04); 
    position:relative;
  }

  .price-card:hover{transform:translateY(-6px);}
  
  .price-card.featured:hover{transform:scale(1.04) translateY(-6px);}
  
  .badge{
    position:absolute; 
    top:-14px; 
    left:50%; 
    transform:translateX(-50%);
    background:linear-gradient(135deg,var(--violet),var(--violet-2)); 
    color:#fff;
    font-size:11px; 
    font-weight:700; 
    padding:6px 16px; 
    border-radius:999px; 
    letter-spacing:1px;
  }

  .price-card h3{
    font-family:var(--display); 
    font-size:20px; 
    margin-bottom:6px;
  }
  
  .price-card .tier-desc{
    color:var(--muted); 
    font-size:13px; 
    margin-bottom:20px;
  }
  
  .price-card .amount{
    font-family:var(--display); 
    font-size:38px; 
    font-weight:800; 
    margin-bottom:4px;
  }
  
  .price-card .amount span{
    font-size:14px; 
    color:var(--muted); 
    font-weight:500;
  }
  
  .price-card ul{
    margin:26px 0; 
    display:flex; 
    flex-direction:column; 
    gap:12px;
  }
  
  .price-card li{
    display:flex; 
    gap:10px; 
    align-items:flex-start; 
    font-size:13.5px; 
    color:#d7d4e0;
  }
  
  .price-card li svg{
    min-width:16px; 
    color:var(--violet-2); 
    margin-top:2px;
  }
  
  .price-card .btn-outline, .price-card .btn-solid{
    width:100%; 
    justify-content:center;
  }
  
  .pricing-faq{
    max-width:760px; 
    margin:80px auto 0; 
    display:flex; 
    flex-direction:column; 
    gap:14px;
  }
  
  .faq-item{
    background:var(--card); 
    border:1px solid var(--line); 
    border-radius:14px;
    padding:20px 24px; 
    cursor:pointer;
  }
  
  .faq-item h4{
    font-size:14.5px; 
    display:flex; 
    justify-content:space-between; 
    align-items:center;
  }
  
  .faq-item h4 svg{
    transition:.3s ease; 
    color:var(--violet-2); 
    min-width:18px;
  }
  
  .faq-item.open h4 svg{
    transform:rotate(45deg);
  }
  
  .faq-item p{
    color:var(--muted); 
    font-size:13.5px; 
    line-height:1.7; 
    margin-top:0; 
    max-height:0; 
    overflow:hidden; 
    transition:.3s ease;
  }
  
  .faq-item.open p{
    margin-top:12px; 
    max-height:200px;
  }

  /* ---------- CONTACT ---------- */
  
  .contact-grid{
    display:grid; 
    grid-template-columns:1fr 1.1fr; 
    gap:60px;
  }
  
  .contact-info .item{
    display:flex; gap:16px; 
    margin-bottom:28px;
  }

  .contact-info .ic{
    width:46px; 
    height:46px; 
    min-width:46px; 
    border-radius:12px;
    background:rgba(139,92,246,.14); 
    display:flex; 
    align-items:center; 
    justify-content:center; 
    color:var(--violet-2);
  }

  .contact-info h4{
    font-size:14.5px; 
    margin-bottom:3px;
  }

  .contact-info p{
    color:var(--muted); 
    font-size:13.5px;
  }

  .contact-info .img-placeholder{
    aspect-ratio:16/9; 
    margin-top:12px;
  }

  .form-card{
    background:var(--card); 
    border:1px solid var(--line); 
    border-radius:20px; 
    padding:36px;
  }

  .form-row{
    display:grid; 
    grid-template-columns:1fr 1fr; 
    gap:16px; 
    margin-bottom:16px;
  }

  .form-card input, .form-card textarea, .form-card select{
    width:100%; background:rgba(255,255,255,.03); 
    border:1px solid var(--line); 
    border-radius:10px;
    padding:14px 16px; color:#fff; 
    font-family:var(--body); 
    font-size:14px; 
    outline:none; 
    transition:.3s ease;
  }

  .form-card input:focus, .form-card textarea:focus, .form-card select:focus{
    border-color:var(--violet-2); 
    background:rgba(139,92,246,.05);
  }

  .form-card textarea{
    margin-bottom:20px; 
    resize:vertical; 
    min-height:110px;
  }

  .form-status{
    margin-top:14px; 
    font-size:13px; 
    color:var(--violet-2); 
    min-height:18px;
  }

  .form-status.success{
    display:flex; align-items:center; gap:10px;
    color:#4ade80; background:rgba(34,197,94,.1);
    border:1px solid rgba(74,222,128,.3);
    border-radius:10px; padding:12px 14px;
    animation:fadeUp .4s ease forwards;
  }

  .form-status.error{
    display:flex; align-items:center; gap:10px;
    color:#f87171; background:rgba(248,113,113,.1);
    border:1px solid rgba(248,113,113,.3);
    border-radius:10px; padding:12px 14px;
    animation:fadeUp .4s ease forwards;
  }

  .form-status.sending{
    display:flex; align-items:center; gap:10px;
    color:var(--muted);
  }

  .spinner{
    width:14px; height:14px; border-radius:50%;
    border:2px solid rgba(255,255,255,.2);
    border-top-color:var(--violet-2);
    animation:spin .7s linear infinite;
    flex-shrink:0;
  }

  @keyframes spin{ to{transform:rotate(360deg);} }

  .btn-solid:disabled{
    opacity:.65; cursor:not-allowed; transform:none !important; box-shadow:none !important;
  }

  /* ---------- CONTACT SPEED-DIAL WIDGET ---------- */
  .contact-fab{
    position:fixed; bottom:28px; left:28px; z-index:95;
    width:56px; height:56px; border-radius:50%;
    background:linear-gradient(135deg,var(--violet),var(--violet-2));
    border:none; color:#fff; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 25px var(--violet-glow);
    transition:transform .3s ease;
  }
  .contact-fab:hover{ transform:scale(1.06); }
  .contact-fab svg{ transition:transform .3s ease; }
  .contact-fab.open svg{ transform:rotate(45deg); }

  .contact-dial-item{
    position:fixed; left:28px; z-index:94;
    width:50px; height:50px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:#fff; border:none; cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,.35);
    opacity:0; transform:translateY(10px) scale(.6);
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease, bottom .25s ease;
  }
  .contact-dial-item.show{
    opacity:1; transform:translateY(0) scale(1);
    pointer-events:auto;
  }
  .contact-dial-item .dial-label{
    position:absolute; left:64px; top:50%; transform:translateY(-50%);
    background:var(--bg-2); border:1px solid var(--line);
    padding:6px 12px; border-radius:8px;
    font-size:12.5px; font-weight:600; color:#fff;
    white-space:nowrap; opacity:0; pointer-events:none;
    transition:opacity .2s ease;
  }
  .contact-dial-item:hover .dial-label{ opacity:1; }

  /* ---------- FOOTER ---------- */

  footer{
    border-top:1px solid var(--line); 
    padding:44px 0; 
    margin-top:40px;
  }

  .footer-inner{
    display:flex; 
    justify-content:space-between; 
    align-items:center; 
    flex-wrap:wrap; 
    gap:16px;
  }

  .footer-inner .logo .mark{font-size:20px;}
  
  .socials{display:flex; gap:12px;}
  
  .socials a{
    width:38px; 
    height:38px; 
    border-radius:50%; 
    border:1px solid var(--line);
    display:flex; 
    align-items:center; 
    justify-content:center; 
    transition:.3s ease;
  }

  .socials a:hover{
    border-color:var(--violet-2); 
    background:rgba(139,92,246,.12); 
    transform:translateY(-3px);
  }
  
  .copy{color:var(--muted); font-size:13px;}

  #toTop{
    position:fixed; 
    bottom:28px; 
    right:28px; 
    width:48px; 
    height:48px; 
    border-radius:50%;
    background:linear-gradient(135deg,var(--violet),var(--violet-2)); border:none; color:#fff;
    display:flex; 
    align-items:center; 
    justify-content:center; 
    cursor:pointer; 
    z-index:90;
    opacity:0; 
    pointer-events:none; 
    transition:.35s ease; 
    box-shadow:0 10px 25px var(--violet-glow);
  }

  #toTop.show{
    opacity:1; 
    pointer-events:auto; 
    transform:translateY(0);
  }

  /* Lightbox */
  .lb-overlay{
    position:fixed; inset:0; z-index:200;
    background:rgba(5,4,8,.92);
    backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    padding:40px;
    animation:fadeUp .25s ease forwards;
  }
  .lb-overlay img, .lb-overlay video{
    max-width:90vw; max-height:85vh; border-radius:14px;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
    border:1px solid var(--line);
  }
  .lb-close{
    position:absolute; top:26px; right:32px;
    width:44px; height:44px; border-radius:50%;
    background:rgba(255,255,255,.06); border:1px solid var(--line); color:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:.3s ease;
  }
  .lb-close:hover{background:var(--violet-2); border-color:var(--violet-2); transform:rotate(90deg);}

  @media (max-width:1100px){
  
    .hero-grid{
      grid-template-columns:1fr; 
      text-align:center;
    }

    .hero p.desc{
      margin:0 auto;
    }

    .services-strip{
      grid-template-columns:repeat(3,1fr);
    }

    .mascot-col{order:-1; margin-bottom:20px;}

    header .cta-btn{display:none;}

    .features{flex-direction:row; flex-wrap:wrap; justify-content:center;}
    
    .feature{max-width:220px;}
    
    .about-grid, .contact-grid{grid-template-columns:1fr;}
    
    .about-gallery{grid-template-columns:1fr 1fr;}
    
    .team-grid{grid-template-columns:repeat(2,1fr);}
    
    .cards-grid, .portfolio-grid, .pricing-grid{grid-template-columns:1fr 1fr;}
    
    .price-card.featured{transform:none;}
    
    nav.links{display:none;}
    
    .burger{display:flex;}
  }

  @media (max-width:640px){
   
    .wrap{padding:0 22px;}
    
    header{padding:18px 22px;}
    
    .services-strip{grid-template-columns:repeat(2,1fr);}
    
    .cards-grid, .portfolio-grid, .pricing-grid, .team-grid{grid-template-columns:1fr;}
    
    .form-row{grid-template-columns:1fr;}
    
    .hero-btns{flex-direction:column; width:100%;}
    
    .about-gallery{grid-template-columns:1fr;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
  }

</style>

</head>

<body>

  <div id="root"></div>

<script type="text/babel">

const { useState, useEffect, useRef, createContext, useContext } = React;

/* ---------- Lightbox ---------- */
const LightboxCtx = createContext(null);

function LightboxProvider({ children }) {
  const [src, setSrc] = useState(null);
  const open = (imgSrc) => setSrc(imgSrc);
  const close = () => setSrc(null);
  const isVideo = src && /\.(mp4|webm|mov)$/i.test(src);
  return (
    <LightboxCtx.Provider value={{ open }}>
      {children}
      {src && (
        <div className="lb-overlay" onClick={close}>
          <button className="lb-close" onClick={close} aria-label="Close">
            <Icon size={20}><path d="M18 6L6 18M6 6l12 12"/></Icon>
          </button>
          {isVideo ? (
            <video src={src} controls autoPlay onClick={(e) => e.stopPropagation()} />
          ) : (
            <img src={src} onClick={(e) => e.stopPropagation()} alt="Preview" />
          )}
        </div>
      )}
    </LightboxCtx.Provider>
  );
}

function useLightbox() {
  return useContext(LightboxCtx);
}

/* ---------- small icon helpers ---------- */

const Icon = ({ children, size = 20 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">{children}</svg>
);

const ImagePlaceholder = ({ label = "sva1.png", hint = "Recommended: high-res JPG/PNG", style }) => (
  <div className="img-placeholder" style={style}>
    <Icon size={26}>
      <rect x="3" y="3" width="18" height="18" rx="3" />
      <circle cx="9" cy="9" r="1.8" />
      <path d="M21 15l-5-5-9 9" />
    </Icon>
    <span>{label}</span>
    <small>{hint}</small>
  </div>
);

/* ---------- data ---------- */
const NAV_ITEMS = [
  { id: "home", label: "Home" },
  { id: "about", label: "About" },
  { id: "services", label: "Services" },
  { id: "portfolio", label: "Portfolio" },
  { id: "pricing", label: "Pricing" },
  { id: "contact", label: "Contact" },
];

const SERVICES = [
  { title: "Graphic Design", desc: "Logos, posters, packaging and print — visuals that hold their own anywhere they're placed.", image: "graphic-design.png", icon: (<><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.4-.3-.4-.5-.9-.5-1.4 0-1.1.9-2 2-2h2.5c2.5 0 4.5-2 4.5-4.5C22 6 17.5 2 12 2z"/></>) },
  { title: "Web Development", desc: "Fast, responsive websites built to convert — from single-page sites to full custom platforms.", image: "web-development.png", icon: (<><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></>) },
  { title: "Social Media Management", desc: "Content calendars, posting, and community growth so your feed never goes quiet.", image: "social-media-management.png", icon: (<><path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 11-5.8-1.6"/></>) },
  { title: "Video Editing", desc: "Reels, ads, and promo videos cut for retention, from raw footage to final export.", image: "video-editing.png", icon: (<><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></>) },
  { title: "Branding & Identity", desc: "A complete visual identity system — colors, type, voice — built to stay consistent everywhere.", image: "branding-identity.png", icon: (<><path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20M12 3l-3 6 3 12 3-12z"/></>) },
  { title: "Virtual Assistant", desc: "Day-to-day admin, scheduling, and inbox support so nothing on your to-do list slips.", image: "virtual-assistant.png", icon: (<><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></>) },
];

const PORTFOLIO_ITEMS = [
  { title: "FitCore Gym Website", tag: "WEB DEV", image: "fitcore.png", detailImage: "fitcore-full.png" },
  { title: "Fitness Solution Brand Site", tag: "WEB DEV", image: "fitness-solution.png", detailImage: "fitness-solution-full.png" },
  { title: "Bon Appetit Cafe IG Audit", tag: "SOCIAL", image: "bon-appetit.png", detailImage: "bon-appetit-full.png" },
  { title: "Aale Ali Fashion Content", tag: "BRANDING", image: "aale-ali.png", detailImage: "aale-ali-full.png" },
  { title: "Fine Audio Ad Campaign", tag: "DESIGN", image: "fine-audio.png", detailImage: "fine-audio-full.png" },
  { title: "SVA Mascot 3D Character", tag: "BRANDING", image: "sva-mascot.png", detailImage: "sva-mascot-full.png" },
];

const FILTERS = ["ALL", "WEB DEV", "SOCIAL", "BRANDING", "DESIGN"];

const FAQS = [
  { q: "How fast can you start?", a: "Most projects kick off within 2-3 business days of the brief being confirmed." },
  { q: "Can I upgrade my plan later?", a: "Yes — you can move from Starter to Growth or a custom Enterprise scope at any time." },
  { q: "Do you offer revisions?", a: "Every package includes revision rounds; Enterprise clients get unlimited revisions." },
];

const TEAM = [
  { name: "Team Member", role: "Creative Director", photo: "creative-director.png" },
  { name: "Team Member", role: "Lead Developer", photo: "https://i.pravatar.cc/300?img=68" },
  { name: "Team Member", role: "Social Strategist", photo: "https://i.pravatar.cc/300?img=47" },
  { name: "Team Member", role: "Video Editor", photo: "https://i.pravatar.cc/300?img=33" },
];

/* ---------- layout pieces ---------- */
function Header({ page, setPage, mobileOpen, setMobileOpen, scrolled }) {
  return (
    <header className={scrolled ? "scrolled" : ""}>
      <button className="logo" onClick={() => setPage("home")}>
        <span className="mark">SV<span>A</span></span>
        <span className="sub">DESIGN</span>
      </button>
      <nav className="links">
        {NAV_ITEMS.map(item => (
          <button key={item.id} className={page === item.id ? "active" : ""} onClick={() => setPage(item.id)}>
            {item.label}
          </button>
        ))}
      </nav>
      <button className="cta-btn" onClick={() => setPage("contact")}>
        Get Started
        <Icon size={16}><path d="M5 12h14M13 6l6 6-6 6"/></Icon>
      </button>
      <button
        onClick={() => window.open(ADMIN_PANEL_URL, "_blank")}
        aria-label="Admin sign in"
        title="Admin sign in / sign up"
        style={{
          width: "38px", height: "38px", borderRadius: "10px",
          background: "rgba(255,255,255,.03)", border: "1px solid var(--line)",
          color: "var(--muted)", display: "flex", alignItems: "center",
          justifyContent: "center", cursor: "pointer", marginLeft: "12px",
          transition: ".3s ease"
        }}
        onMouseEnter={e => { e.currentTarget.style.borderColor = "var(--violet-2)"; e.currentTarget.style.color = "#fff"; }}
        onMouseLeave={e => { e.currentTarget.style.borderColor = "var(--line)"; e.currentTarget.style.color = "var(--muted)"; }}
      >
        <Icon size={17}><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></Icon>
      </button>
      <button className="burger" onClick={() => setMobileOpen(!mobileOpen)} aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </header>
  );
}

function MobileMenu({ open, page, setPage, close }) {
  return (
    <div className={"mobile-menu" + (open ? " open" : "")}>
      {NAV_ITEMS.map(item => (
        <button key={item.id} onClick={() => { setPage(item.id); close(); }}>{item.label}</button>
      ))}
      <button
        style={{ fontSize: "15px", color: "var(--muted)", display: "flex", alignItems: "center", gap: "8px" }}
        onClick={() => { window.open(ADMIN_PANEL_URL, "_blank"); close(); }}
      >
        <Icon size={17}><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></Icon>
        Admin Sign In
      </button>
    </div>
  );
}

function Footer({ setPage }) {
  return (
    <footer>
      <div className="wrap footer-inner">
        <button className="logo" onClick={() => setPage("home")}><span className="mark">SV<span>A</span> DESIGN</span></button>
        <div className="socials">
          <a href="https://www.instagram.com/smart.va.design/" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><Icon size={16}><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></Icon></a>
          <a href="#https://www.facebook.com/profile.php?id=61589751291299" aria-label="Facebook"><Icon size={16}><path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/></Icon></a>
          <a href="#" aria-label="LinkedIn"><Icon size={16}><path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></Icon></a>
        </div>
        <p className="copy">© 2026 SVA Design. All rights reserved.</p>
      </div>
    </footer>
  );
}

function PageHeader({ eyebrow, title, gradWord, current, style }) {
  return (
    <section className="page-header wrap" style={style}>
      <div className="sec-eyebrow">{eyebrow}</div>
      <h1 className="sec-title">{title} <span>{gradWord}</span></h1>
      <p className="breadcrumb">Home / <span>{current}</span></p>
    </section>
  );
}

/* ---------- PAGES ---------- */
function HomePage({ setPage }) {
  return (
    <div className="page-enter">
      <section className="hero" id="home">
        <div className="wrap hero-grid">
          <div className="hero-copy">
            <div className="eyebrow">SMART SOLUTIONS. REAL RESULTS.</div>
            <h1 className="headline">WE ELEVATE<br/>YOUR <span className="grad">BRAND</span></h1>
            <div className="divider"></div>
            <p className="desc"><strong>SVA Design</strong> is your all-in-one creative and digital partner. We build brands, grow businesses &amp; deliver results.</p>
            <div className="hero-btns">
              <button className="btn-solid" onClick={() => setPage("services")}>
                Explore Services <Icon size={16}><path d="M5 12h14M13 6l6 6-6 6"/></Icon>
              </button>
              <button className="btn-outline" onClick={() => setPage("portfolio")}>
                View Portfolio <Icon size={16}><path d="M5 12h14M13 6l6 6-6 6"/></Icon>
              </button>
            </div>

            <div className="services-strip">
              {SERVICES.map(s => (
                <button key={s.title} className="item" onClick={() => setPage("services")}>
                  <div className="icon"><Icon>{s.icon}</Icon></div>
                  <span>{s.title}</span>
                </button>
              ))}
            </div>
          </div>

          <div className="mascot-col">
            <div className="orbit-wrap">
              <div className="orbit-glow"></div>
              <svg className="orbit-lines" viewBox="0 0 100 100">
                {SERVICES.map((s, i) => {
                  const angle = (i * (360 / SERVICES.length) - 90) * (Math.PI / 180);
                  const x = 50 + 38 * Math.cos(angle);
                  const y = 50 + 38 * Math.sin(angle);
                  return (
                    <line
                      key={s.title}
                      x1="50" y1="50" x2={x} y2={y}
                      className="orbit-line"
                      style={{ animationDelay: `${i * 0.08 + 0.2}s` }}
                    />
                  );
                })}
              </svg>

function ContactPage() {
  const [status, setStatus] = useState({ state: "idle", text: "" });
  const { open } = useLightbox();

  const submit = async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    setStatus({ state: "sending", text: "Sending your message…" });
    try {
      const res = await fetch("https://sva-backend-production.up.railway.app/api/contact", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: formData.get("name"),
          email: formData.get("email"),
          service: formData.get("service"),
          message: formData.get("message"),
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        setStatus({ state: "success", text: data.message || "Thanks! Your message has been sent — we'll get back to you soon." });
        e.target.reset();
      } else {
        setStatus({ state: "error", text: data.error || "Something went wrong — please try again or email us directly." });
      }
    } catch (err) {
      setStatus({ state: "error", text: "Connection error — please make sure the backend is running." });
    }
  };

  return (
    <div className="page-enter">
      <section className="wrap" style={{paddingTop:"130px"}}>
        <img
          src="contact-banner.png"
          alt="Contact"
          style={{
            width: "95%",
            height: "auto",
            borderRadius: "10px",
            border: "0.5px solid var(--line)",
            cursor: "pointer",
            display: "block"
          }}
          onClick={() => open("contact-banner.png")}
        />
      </section>
      <PageHeader eyebrow="GET IN TOUCH" title="Let's Build" gradWord="Something Great" current="Contact" style={{paddingTop:"50px"}} />
      <section className="pad" style={{paddingTop:"0"}}>
        <div className="wrap">
          <div className="contact-grid">
            <div className="contact-info">
              <div className="item"><div className="ic"><Icon><path d="M22 6l-10 7L2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/></Icon></div><div><h4>Email</h4><p>smartvadesign@gmail.com</p></div></div>
              <div className="item"><div className="ic"><Icon><path d="M22 16.92v3a2 2 0 01-2.18 2 19.8 19.8 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.8 19.8 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.68 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.32 1.85.55 2.81.68A2 2 0 0122 16.92z"/></Icon></div><div><h4>Phone / WhatsApp</h4><p>+92 3193116103</p></div></div>
              <div className="item"><div className="ic"><Icon><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></Icon></div><div><h4>Studio</h4><p>North Nazimabad, Karachi, Pakistan</p></div></div>
              <img src="sva-studio.png" hint="16:9, map screenshot" />
            </div>
            <form className="form-card" onSubmit={submit}>
              <div className="form-row">
                <input type="text" name="name" placeholder="Your Name" required disabled={status.state === "sending"} />
                <input type="email" name="email" placeholder="Your Email" required disabled={status.state === "sending"} />
              </div>
              <select name="service" style={{marginBottom:"16px"}} defaultValue="" disabled={status.state === "sending"}>
                <option value="" disabled>Which service are you interested in?</option>
                <option>Graphic Design</option>
                <option>Web Development</option>

                {status.state === "sending" ? (
                  <>Sending<span className="spinner"></span></>
                ) : (
                  <>Send Message <Icon size={16}><path d="M5 12h14M13 6l6 6-6 6"/></Icon></>
                )}
              </button>

              {status.state === "success" && (
                <div className="form-status success">
                  <Icon size={18}><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></Icon>

              )}
              {status.state === "error" && (

    setMobileOpen(false);
    if (mainRef.current) mainRef.current.scrollIntoView({ behavior: "instant" in window ? "instant" : "auto" });
    window.scrollTo(0, 0);
  };

  useEffect(() => {
    const onScroll = () => {
      setScrolled(window.scrollY > 30);
      setShowTop(window.scrollY > 500);
    };
    window.addEventListener("scroll", onScroll);
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  const pages = {
    home: <HomePage setPage={setPage} />,
    about: <AboutPage />,
    services: <ServicesPage setPage={setPage} />,
    portfolio: <PortfolioPage />,
    pricing: <PricingPage setPage={setPage} />,
    contact: <ContactPage />,
  };

  return (
    <LightboxProvider>
      <Header page={page} setPage={setPage} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} scrolled={scrolled} />
      <MobileMenu open={mobileOpen} page={page} setPage={setPage} close={() => setMobileOpen(false)} />
      <div ref={mainRef}>
        {pages[page]}
      </div>
      <Footer setPage={setPage} />
      <ContactWidget />
      <button id={"toTop"} className={showTop ? "show" : ""} onClick={() => window.scrollTo({top:0, behavior:"smooth"})} aria-label="Back to top">
        <Icon size={18}><path d="M12 19V5M5 12l7-7 7 7"/></Icon>
      </button>
    </LightboxProvider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
